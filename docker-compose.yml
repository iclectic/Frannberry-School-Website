services:
  postgres:
    image: postgres:16-alpine
    container_name: frannberry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: frannberry
      POSTGRES_PASSWORD: frannberry_secret_2026
      POSTGRES_DB: frannberry_school
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U frannberry -d frannberry_school']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: frannberry_s3
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: frannberry_minio
      MINIO_ROOT_PASSWORD: frannberry_minio_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: frannberry_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  s3data:
